name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Run Playwright tests
      id: run-playwright
      run: npx playwright test

    # --- AGENTE DE QA CON GEMINI EN CASO DE FALLA ---
    - name: AI QA Agent - Gemini Analysis
      if: failure()
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "🤖 Agente QA instalando SDK y analizando la falla del test..."
        npm install @google/genai --no-save

        node -e "
        const { GoogleGenAI } = require('@google/genai');

        const apiKey = process.env.GEMINI_API_KEY;
        if (!apiKey) {
          console.log('⚠️ No se encontró GEMINI_API_KEY en los Secrets de GitHub.');
          process.exit(0);
        }

        const ai = new GoogleGenAI({ apiKey });

        async function run() {
          try {
            const prompt = \`Actúa como un QA Lead Senior especialista en Playwright y APIs REST.
        Analiza la falla del pipeline de CI/CD y responde de forma breve en español:
        1. Qué falló exactamente.
        2. Causa raíz probable (status code, payload, timeout, etc.).
        3. Solución sugerida para el código.\`;

            const response = await ai.models.generateContent({
              model: 'gemini-3.8-flash',
              contents: prompt,
            });

            console.log('\n========================================');
            console.log('🤖 ANÁLISIS DEL AGENTE QA (GEMINI)');
            console.log('========================================\n');
            console.log(response.text);
          } catch (error) {
            console.error('Error al consultar a Gemini:', error.message || error);
          }
        }

        run();
        "

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
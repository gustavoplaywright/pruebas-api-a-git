name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Run Playwright tests
      id: run-playwright
      run: npx playwright test

    # --- AGENTE DE QA RESILIENTE CON MODELOS VIGENTES ---
    - name: AI QA Agent - Gemini Analysis
      if: failure()
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "🤖 Agente QA instalando SDK y analizando la falla del test..."
        npm install @google/genai --no-save

        node -e "
        const { GoogleGenAI } = require('@google/genai');

        const apiKey = process.env.GEMINI_API_KEY;
        if (!apiKey) {
          console.log('⚠️ No se encontró GEMINI_API_KEY en los Secrets de GitHub.');
          process.exit(0);
        }

        const ai = new GoogleGenAI({ apiKey });

        const prompt = \`Actúa como un QA Lead Senior especialista en Playwright y APIs REST.
        Analiza la falla del pipeline de CI/CD y responde de forma breve en español:
        1. Qué falló exactamente.
        2. Causa raíz probable (status code, payload, timeout, etc.).
        3. Solución sugerida para el código.\`;

        // Usamos los nombres exactos requeridos por la API en la captura
        const modelsToTry = ['gemini-3.8-flash', 'gemini-3.1-pro-preview'];

        async function generateWithRetry(modelName, maxRetries = 3) {
          for (let attempt = 1; attempt <= maxRetries; attempt++) {
            try {
              return await ai.models.generateContent({
                model: modelName,
                contents: prompt,
              });
            } catch (error) {
              const errorMsg = error.message || String(error);
              if ((errorMsg.includes('503') || errorMsg.includes('UNAVAILABLE')) && attempt < maxRetries) {
                console.log(\`⚠️ [503 High Demand] Reintentando (\${attempt}/\${maxRetries}) en modelo \${modelName}...\`);
                await new Promise(res => setTimeout(res, attempt * 3000));
              } else {
                throw error;
              }
            }
          }
        }

        async function run() {
          for (const model of modelsToTry) {
            try {
              console.log(\`🔄 Consultando modelo \${model}...\`);
              const response = await generateWithRetry(model);
              
              console.log('\n========================================');
              console.log('🤖 ANÁLISIS DEL AGENTE QA (GEMINI)');
              console.log('========================================\n');
              console.log(response.text);
              return;
            } catch (err) {
              console.log(\`❌ Modelo \${model} falló: \${err.message || err}\`);
            }
          }
          console.error('❌ Todos los modelos fallaron.');
        }

        run();
        "

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30